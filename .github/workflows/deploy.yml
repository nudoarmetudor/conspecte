name: Publicare pe GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # istoricul git dă datele de modificare ale notelor
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Instalare dependențe
        run: npm ci
      - name: Verificări înainte de publicare
        run: node scripts/verifica-publicare.mjs
      - name: Construire site
        run: npx quartz build
      - name: Încărcare artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicare pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
