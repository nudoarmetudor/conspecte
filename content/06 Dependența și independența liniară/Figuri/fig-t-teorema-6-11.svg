  <text x="20" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⇒) αa + βb + γc = 0, cu α, β, γ ≠ 0</text>
