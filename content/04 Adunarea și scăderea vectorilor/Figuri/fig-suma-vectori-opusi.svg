  <line x1="350" y1="90" x2="350" y2="145" stroke="#909090" stroke-width="1"/>
  <circle cx="90" cy="90" r="4.5" fill="#909090"/>
  <circle cx="350" cy="90" r="4.5" fill="#909090"/>
  <text x="90" y="76" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">A</text>
  <text x="350" y="76" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">B</text>
  <text x="220" y="82" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">AB</text>
  <line x1="212" y1="63" x2="228" y2="63" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="220" y="175" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">BA</text>
  <line x1="212" y1="156" x2="228" y2="156" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="35" y="40" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">pornim din A și ne întoarcem în A</text>
  <text x="35" y="212" font-size="15" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">AB + BA = AA = 0    ⇒    a + (−a) = 0</text>
