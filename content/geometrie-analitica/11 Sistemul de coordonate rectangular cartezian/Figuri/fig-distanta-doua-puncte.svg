  <text x="30" y="266" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">ρ(A, B) = √((x₂ − x₁)² + (y₂ − y₁)²)</text>
