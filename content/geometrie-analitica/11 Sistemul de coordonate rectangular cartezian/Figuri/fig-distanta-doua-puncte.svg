  <circle cx="380" cy="80" r="5" fill="#8B7BD8"/>
  <text x="64" y="187" font-size="14" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">A(x₁; y₁)</text>
  <text x="390" y="74" font-size="14" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">B(x₂; y₂)</text>
