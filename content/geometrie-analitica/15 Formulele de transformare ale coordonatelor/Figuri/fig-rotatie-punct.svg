  <text x="20" y="282" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">x = 2·cos 30° − 0·sin 30° = √3,   y = 2·sin 30° + 0·cos 30° = 1</text>
