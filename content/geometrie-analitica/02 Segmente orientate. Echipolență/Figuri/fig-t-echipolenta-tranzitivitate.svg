  <line x1="290" y1="75" x2="400" y2="45" stroke="#8B7BD8" stroke-width="2.8" marker-end="url(#av)"/>
  <circle cx="40" cy="120" r="4.5" fill="#4C86D6"/>
  <circle cx="90" cy="215" r="4.5" fill="#E08A3C"/>
  <circle cx="290" cy="75" r="4.5" fill="#8B7BD8"/>
