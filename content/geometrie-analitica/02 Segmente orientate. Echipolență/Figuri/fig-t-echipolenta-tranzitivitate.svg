  <text x="20" y="262" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">AB ↑↑ CD ↑↑ EF și |AB| = |CD| = |EF|</text>
  <text x="20" y="281" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ AB ↑↑ EF și |AB| = |EF|: AB echipolent cu EF</text>
