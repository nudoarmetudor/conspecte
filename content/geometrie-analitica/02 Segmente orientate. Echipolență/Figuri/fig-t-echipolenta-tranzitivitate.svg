  <text x="250" y="190" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">ABDC — paralelogram (ipoteza 1)</text>
  <text x="250" y="208" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">CDFE — paralelogram (ipoteza 2)</text>
