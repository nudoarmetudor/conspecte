  <text x="154" y="79" font-size="16" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">B</text>
  <text x="77" y="223" font-size="16" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">C</text>
