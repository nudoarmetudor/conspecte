<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 282" width="500" height="282" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CA88A"/></marker>
  </defs>
  <text x="20" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">σ = {a, b, c} necoplanari ⇒ independent</text>
  <polygon points="100,190 220,190 165,235 45,235" fill="#4C86D6" fill-opacity="0.1" stroke="#4C86D6" stroke-width="1.2" stroke-opacity="0.7"/>
  <polygon points="100,190 220,190 220,70 100,70" fill="#4CA88A" fill-opacity="0.07" stroke="#4CA88A" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="100" y1="190" x2="220" y2="190" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <line x1="100" y1="190" x2="45" y2="235" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <line x1="100" y1="190" x2="100" y2="70" stroke="#4CA88A" stroke-width="2.8" marker-end="url(#at)"/>
  <circle cx="100" cy="190" r="4.5" fill="#909090"/>
  <text x="88" y="184" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">O</text>
  <text x="230" y="205" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <line x1="225.5" y1="186" x2="234.5" y2="186" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="34" y="232" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">b</text>
  <line x1="29.5" y1="213" x2="38.5" y2="213" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="86" y="88" font-size="17" fill="#4CA88A" text-anchor="middle" font-weight="normal" font-style="italic">c</text>
  <line x1="81.5" y1="69" x2="90.5" y2="69" stroke="#4CA88A" stroke-width="1.3" marker-end="url(#at)"/>
  <line x1="262" y1="40" x2="262" y2="250" stroke="#909090" stroke-width="0.8"/>
  <text x="278" y="60" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">orice subsistem:</text>
  <text x="278" y="84" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">{a, b}, {a, c}, {b, c} — necoliniari</text>
  <text x="278" y="104" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">{a}, {b}, {c} — nenuli</text>
  <text x="278" y="124" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ toate liniar independente</text>
  <text x="278" y="164" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">de ce nu altfel: dacă un subsistem</text>
  <text x="278" y="182" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">ar fi dependent, teorema 6.7 ar face</text>
  <text x="278" y="200" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">σ dependent — contradicție</text>
  <text x="20" y="270" font-size="11" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">planele colorate: a și b (albastru), a și c (verde) — c iese din planul lui a, b</text>
</svg>
