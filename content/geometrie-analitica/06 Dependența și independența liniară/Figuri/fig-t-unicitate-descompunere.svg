<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B7BD8"/></marker>
  </defs>
  <text x="20" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">geometric: prin C trece o singură paralelă la b</text>
  <line x1="20" y1="150" x2="330" y2="150" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="31" y1="165" x2="106" y2="40" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="168" y1="170" x2="243" y2="45" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="264" y1="150" x2="225" y2="75" stroke="#D4696A" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="40" y1="150" x2="110" y2="150" stroke="#4C86D6" stroke-width="3.2" marker-end="url(#ab)"/>
  <line x1="40" y1="150" x2="70" y2="100" stroke="#E08A3C" stroke-width="3.2" marker-end="url(#ao)"/>
  <line x1="40" y1="150" x2="180" y2="150" stroke="#4C86D6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <line x1="180" y1="150" x2="225" y2="75" stroke="#E08A3C" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ao)"/>
  <line x1="40" y1="150" x2="225" y2="75" stroke="#8B7BD8" stroke-width="3" marker-end="url(#av)"/>
  <circle cx="40" cy="150" r="4.5" fill="#909090"/>
  <circle cx="180" cy="150" r="4.5" fill="#909090"/>
  <circle cx="225" cy="75" r="4.5" fill="#8B7BD8"/>
  <circle cx="264" cy="150" r="5" fill="none" stroke="#D4696A" stroke-width="2"/>
  <text x="36" y="170" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">O</text>
  <text x="176" y="172" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">C₁</text>
  <text x="237" y="69" font-size="16" fill="#8B7BD8" text-anchor="middle" font-weight="normal" font-style="italic">C</text>
  <text x="272" y="172" font-size="16" fill="#D4696A" text-anchor="middle" font-weight="normal" font-style="italic">C₁′ ?</text>
  <text x="92" y="172" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <line x1="87.5" y1="153" x2="96.5" y2="153" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="34" y="118" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">b</text>
  <line x1="29.5" y1="99" x2="38.5" y2="99" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="340" y="70" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">alt C₁′ pe dreapta lui a</text>
  <text x="340" y="88" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">nu dă C₁′C paralel cu b</text>
  <text x="340" y="116" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ C₁ unic ⇒ α și β unici</text>
  <line x1="15" y1="180" x2="485" y2="180" stroke="#909090" stroke-width="0.8"/>
  <text x="20" y="202" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">algebric: (α − α₁)a = (β₁ − β)b</text>
  <line x1="30" y1="280" x2="220" y2="280" stroke="#4C86D6" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="41" y1="295" x2="89" y2="215" stroke="#E08A3C" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="50" y1="280" x2="160" y2="280" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <line x1="50" y1="280" x2="83" y2="225" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <line x1="160" y1="280" x2="83" y2="225" stroke="#D4696A" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="140" y="245" font-size="14" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">= ?</text>
  <circle cx="50" cy="280" r="4.5" fill="#909090"/>
  <text x="38" y="286" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">O</text>
  <text x="150" y="300" font-size="13" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">(α − α₁)a</text>
  <text x="24" y="222" font-size="13" fill="#E08A3C" text-anchor="start" font-weight="normal" font-style="italic">(β₁ − β)b</text>
  <text x="240" y="232" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">un vector de pe dreapta lui a nu poate</text>
  <text x="240" y="250" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">fi egal cu unul de pe dreapta lui b</text>
  <text x="240" y="268" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">(altfel a ∥ b), decât dacă ambii sunt 0</text>
  <text x="240" y="292" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ α = α₁,  β = β₁</text>
</svg>
