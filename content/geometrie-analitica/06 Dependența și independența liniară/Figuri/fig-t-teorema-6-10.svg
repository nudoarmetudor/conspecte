<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 298" width="480" height="298" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
  </defs>
  <text x="20" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⇒) dependenți ⇒ (T. 6.5) b = αa ⇒ coliniari</text>
  <line x1="20" y1="60" x2="460" y2="60" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="40" y1="60" x2="100" y2="60" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <text x="70" y="51" font-size="15" fill="#4C86D6" text-anchor="start" font-weight="normal" font-style="italic">a</text>
  <line x1="170" y1="60" x2="290" y2="60" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <text x="230" y="51" font-size="14" fill="#E08A3C" text-anchor="start" font-weight="normal" font-style="italic">b = 2a</text>
  <text x="20" y="88" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">b stă pe aceeași direcție cu a</text>
  <line x1="15" y1="102" x2="465" y2="102" stroke="#909090" stroke-width="0.8"/>
  <text x="20" y="124" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⇐) coliniari, cazul a = 0  (teorema 6.6)</text>
  <circle cx="60" cy="160" r="8" fill="none" stroke="#4C86D6" stroke-width="2"/>
  <text x="60" y="188" font-size="13" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a = 0</text>
  <line x1="120" y1="172" x2="230" y2="146" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <text x="178" y="148" font-size="15" fill="#E08A3C" text-anchor="start" font-weight="normal" font-style="italic">b</text>
  <text x="260" y="158" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">1·a + 0·b = 0, coeficient 1 ≠ 0</text>
  <text x="260" y="178" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ dependenți</text>
  <line x1="15" y1="202" x2="465" y2="202" stroke="#909090" stroke-width="0.8"/>
  <text x="20" y="224" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⇐) coliniari, a ≠ 0  (teorema 5.3): b = αa</text>
  <line x1="40" y1="252" x2="160" y2="252" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <line x1="160" y1="268" x2="40" y2="268" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <circle cx="40" cy="260" r="11" fill="none" stroke="#8B7BD8" stroke-width="2"/>
  <text x="100" y="244" font-size="13" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">2a</text>
  <text x="100" y="286" font-size="13" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">(−1)b</text>
  <text x="200" y="254" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">α = 2:  2a + (−1)b = 0, traseu închis</text>
  <text x="200" y="274" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">coeficientul lui b este −1 ≠ 0 ⇒ dependenți</text>
</svg>
