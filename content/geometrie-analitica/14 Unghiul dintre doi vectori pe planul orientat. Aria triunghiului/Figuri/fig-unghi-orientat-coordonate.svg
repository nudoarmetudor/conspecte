  <text x="196.56" y="88.965" font-size="15" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">φ = φ₂ − φ₁</text>
  <text x="255" y="250" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">cos φ = (a₁b₁ + a₂b₂) / (|a|·|b|)</text>
  <text x="255" y="270" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">sin φ = (a₁b₂ − a₂b₁) / (|a|·|b|)</text>
