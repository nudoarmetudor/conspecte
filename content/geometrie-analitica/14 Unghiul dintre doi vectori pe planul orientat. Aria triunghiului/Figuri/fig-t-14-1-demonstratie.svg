<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 290" width="470" height="290" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B7BD8"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4CA88A"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D4696A"/></marker>
  </defs>
  <line x1="150" y1="150" x2="270" y2="150" stroke="#4C86D6" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="150" y1="150" x2="150" y2="30" stroke="#E08A3C" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="150" y1="150" x2="281.064" y2="58.2278" stroke="#8B7BD8" stroke-width="3" marker-end="url(#av)"/>
  <path d="M 203.9 146.2 A 54 54 0 0 0 195.8 121.4" fill="none" stroke="#4CA88A" stroke-width="1.8" marker-end="url(#at)"/>
  <path d="M 155.9 66.2 A 84 84 0 0 1 215.3 97.1" fill="none" stroke="#D4696A" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M 161.0 150.0 L 161.0 139.0 L 150.0 139.0" fill="none" stroke="#909090" stroke-width="1.3"/>
  <circle cx="150" cy="150" r="4.5" fill="#909090"/>
  <text x="138" y="158" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">O</text>
  <text x="260" y="174" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">i</text>
  <line x1="255.5" y1="155" x2="264.5" y2="155" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="132" y="46" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">j</text>
  <line x1="127.5" y1="27" x2="136.5" y2="27" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="285.538" y="44.1062" font-size="17" fill="#8B7BD8" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <line x1="281.038" y1="25.1062" x2="290.038" y2="25.1062" stroke="#8B7BD8" stroke-width="1.3" marker-end="url(#av)"/>
  <text x="213.443" y="131.808" font-size="17" fill="#4CA88A" text-anchor="start" font-weight="normal" font-style="italic">φ</text>
  <text x="193.837" y="60.1206" font-size="15" fill="#D4696A" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">φ − 90°</text>
  <text x="318" y="120" font-size="14" fill="#4CA88A" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(i, a) = φ</text>
  <text x="318" y="142" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">(j, i) = −90°</text>
  <text x="318" y="164" font-size="14" fill="#D4696A" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(j, a) = −90° + φ</text>
  <text x="20" y="248" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a₂ = |a| cos(j, a) = |a| cos(φ − 90°) = |a| sin φ</text>
  <text x="20" y="272" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">necesar: {i, j} cu j la +90° față de i</text>
</svg>
