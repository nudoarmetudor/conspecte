<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 335" width="480" height="335" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
  </defs>
  <text x="20" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⇐) a = λb  ⇒  a ∥ b  (definiția 5.1)</text>
  <line x1="20" y1="52" x2="460" y2="52" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="20" y1="80" x2="460" y2="80" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="40" y1="52" x2="104" y2="52" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <text x="72" y="43" font-size="15" fill="#E08A3C" text-anchor="start" font-weight="normal" font-style="italic">b</text>
  <line x1="150" y1="80" x2="278" y2="80" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <text x="214" y="71" font-size="13" fill="#4C86D6" text-anchor="start" font-weight="normal" font-style="italic">a = 2b</text>
  <line x1="440" y1="80" x2="344" y2="80" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <text x="392" y="71" font-size="13" fill="#4C86D6" text-anchor="start" font-weight="normal" font-style="italic">a = −1,5b</text>
  <text x="20" y="104" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">λb păstrează direcția lui b, deci a e paralel cu b</text>
  <line x1="15" y1="116" x2="465" y2="116" stroke="#909090" stroke-width="0.8"/>
  <text x="20" y="138" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⇒) a ∥ b nenuli  ⇒  λ = a / b există  (definiția 5.2)</text>
  <line x1="40" y1="158" x2="40" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="72" y1="158" x2="72" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="104" y1="158" x2="104" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="136" y1="158" x2="136" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="168" y1="158" x2="168" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="200" y1="158" x2="200" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="232" y1="158" x2="232" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="264" y1="158" x2="264" y2="206" stroke="#909090" stroke-width="0.8" opacity="0.35"/>
  <line x1="40" y1="168" x2="104" y2="168" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <text x="72" y="159" font-size="15" fill="#E08A3C" text-anchor="start" font-weight="normal" font-style="italic">b</text>
  <line x1="264" y1="196" x2="104" y2="196" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <text x="184" y="214" font-size="15" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <text x="310" y="172" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">|b| = 2,  |a| = 5</text>
  <text x="310" y="200" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">a ↑↓ b  ⇒  λ = −2,5</text>
  <text x="20" y="238" font-size="12" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">deci a = −2,5·b: numărul λ „se citește" de pe figură</text>
  <line x1="15" y1="252" x2="465" y2="252" stroke="#909090" stroke-width="0.8"/>
  <text x="20" y="274" font-size="13" fill="#D4696A" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">de ce „nenuli": b = 0, a ≠ 0</text>
  <circle cx="60" cy="300" r="7" fill="none" stroke="#E08A3C" stroke-width="2"/>
  <text x="60" y="325" font-size="13" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">b = 0</text>
  <line x1="110" y1="300" x2="230" y2="300" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <text x="170" y="291" font-size="15" fill="#4C86D6" text-anchor="start" font-weight="normal" font-style="italic">a</text>
  <text x="260" y="298" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">coliniari (convenție), dar</text>
  <text x="260" y="316" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">λ·0 = 0 ≠ a pentru orice λ</text>
</svg>
