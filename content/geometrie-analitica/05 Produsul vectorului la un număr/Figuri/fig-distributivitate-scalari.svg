  <text x="35" y="200" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">(α + β)a = αa + βa — lungimile se adună: (|α| + |β|)·|a|</text>
