<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B7BD8"/></marker>
  </defs>
  <text x="20" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">α, β de același semn:  α = −2,  β = −1,5</text>
  <line x1="210" y1="36" x2="210" y2="128" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="210" cy="48" r="3.5" fill="#909090"/>
  <line x1="210" y1="48" x2="240" y2="48" stroke="#4C86D6" stroke-width="2.6" marker-end="url(#ab)"/>
  <line x1="210" y1="72" x2="150" y2="72" stroke="#E08A3C" stroke-width="2.6" marker-end="url(#ao)"/>
  <line x1="210" y1="96" x2="300" y2="96" stroke="#8B7BD8" stroke-width="2.8" marker-end="url(#av)"/>
  <line x1="210" y1="120" x2="300" y2="120" stroke="#8B7BD8" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#av)"/>
  <text x="345" y="53" font-size="13" fill="#4C86D6" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a</text>
  <text x="345" y="77" font-size="13" fill="#E08A3C" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">b = αa = −2a</text>
  <text x="345" y="101" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">OC = βb = 3a</text>
  <text x="345" y="125" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">OD = (βα)a = 3a</text>
  <line x1="15" y1="140" x2="465" y2="140" stroke="#909090" stroke-width="0.8"/>
  <text x="20" y="162" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">α, β de semne opuse:  α = 2,  β = −1,5</text>
  <line x1="210" y1="176" x2="210" y2="268" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="210" cy="188" r="3.5" fill="#909090"/>
  <line x1="210" y1="188" x2="240" y2="188" stroke="#4C86D6" stroke-width="2.6" marker-end="url(#ab)"/>
  <line x1="210" y1="212" x2="270" y2="212" stroke="#E08A3C" stroke-width="2.6" marker-end="url(#ao)"/>
  <line x1="210" y1="236" x2="120" y2="236" stroke="#8B7BD8" stroke-width="2.8" marker-end="url(#av)"/>
  <line x1="210" y1="260" x2="120" y2="260" stroke="#8B7BD8" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#av)"/>
  <text x="345" y="193" font-size="13" fill="#4C86D6" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a</text>
  <text x="345" y="217" font-size="13" fill="#E08A3C" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">b = αa = 2a</text>
  <text x="345" y="241" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">OC = βb = −3a</text>
  <text x="345" y="265" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">OD = (βα)a = −3a</text>
  <text x="20" y="290" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">|OC| = |OD| și OC ↑↑ OD în ambele cazuri  ⇒  OC = OD</text>
</svg>
