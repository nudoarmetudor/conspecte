  <text x="300" y="40" font-size="15" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">2x + 3y − 6 = 0</text>
  <text x="300" y="66" font-size="12" fill="#4CA88A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a = {3; −2}:  2·3 + 3·(−2) = 0</text>
  <text x="300" y="84" font-size="12" fill="#4CA88A" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ a ∥ d</text>
  <text x="300" y="108" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">b = {2; 1}:  2·2 + 3·1 = 7 ≠ 0</text>
  <text x="300" y="126" font-size="12" fill="#D4696A" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ b nu e paralel cu d</text>
  <text x="20" y="282" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">capătul lui a, depus din M₀ ∈ d, cade pe d exact când Aa₁ + Ba₂ = 0</text>
