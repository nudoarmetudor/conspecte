<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
  </defs>
  <polygon points="20,70 200,70 200,170 20,170" fill="#4C86D6" stroke="#4C86D6" stroke-width="1.4" opacity="0.07"/>
  <text x="110" y="100" font-size="16" fill="#4C86D6" text-anchor="middle" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">dreapta d</text>
  <text x="110" y="126" font-size="14" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">M₀(x₀; y₀)</text>
  <text x="110" y="148" font-size="14" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a = {a₁; a₂}</text>
  <polygon points="320,70 500,70 500,170 320,170" fill="#8B7BD8" stroke="#8B7BD8" stroke-width="1.4" opacity="0.07"/>
  <text x="410" y="112" font-size="16" fill="#8B7BD8" text-anchor="middle" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">Ax + By + C = 0</text>
  <text x="410" y="138" font-size="14" fill="#8B7BD8" text-anchor="middle" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">A² + B² &gt; 0</text>
  <line x1="205" y1="95" x2="315" y2="95" stroke="#E08A3C" stroke-width="2.4" marker-end="url(#ao)"/>
  <line x1="315" y1="148" x2="205" y2="148" stroke="#E08A3C" stroke-width="2.4" marker-end="url(#ao)"/>
  <text x="260" y="84" font-size="13" fill="#E08A3C" text-anchor="middle" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">T. 21.1</text>
  <text x="260" y="168" font-size="13" fill="#E08A3C" text-anchor="middle" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">T. 21.2</text>
  <text x="20" y="210" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">A = a₂,   B = −a₁,   C = a₁y₀ − a₂x₀</text>
  <text x="20" y="232" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">invers: a = {−B; A}, iar M₀ = orice soluție a ecuației</text>
</svg>
