<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 290" width="470" height="290" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
  </defs>
  <line x1="52.5" y1="240" x2="430.8" y2="46" stroke="#909090" stroke-width="1.8"/>
  <line x1="150" y1="190" x2="228" y2="150" stroke="#E08A3C" stroke-width="3.2" marker-end="url(#ao)"/>
  <circle cx="72" cy="230" r="5" fill="#8B7BD8"/>
  <circle cx="150" cy="190" r="5" fill="#909090"/>
  <circle cx="228" cy="150" r="5" fill="#8B7BD8"/>
  <circle cx="306" cy="110" r="5" fill="#8B7BD8"/>
  <circle cx="384" cy="70" r="5" fill="#8B7BD8"/>
  <text x="60" y="256" font-size="12" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t = -1</text>
  <text x="216" y="176" font-size="12" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t = 1</text>
  <text x="294" y="136" font-size="12" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t = 2</text>
  <text x="372" y="96" font-size="12" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t = 3</text>
  <text x="120" y="216" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t = 0</text>
  <text x="142" y="178" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">M₀</text>
  <text x="183" y="156" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <line x1="178.5" y1="137" x2="187.5" y2="137" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <circle cx="274.8" cy="126" r="4.5" fill="#4CA88A"/>
  <text x="232.8" y="114" font-size="12" fill="#4CA88A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t = 1,6</text>
  <text x="20" y="40" font-size="15" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">x = x₀ + a₁t,   y = y₀ + a₂t</text>
  <text x="20" y="62" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">fiecărui t real îi corespunde un punct al dreptei, și invers</text>
  <text x="20" y="280" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">t &gt; 0: în sensul lui a;  t &lt; 0: în sens opus;  t = 0: M₀</text>
</svg>
