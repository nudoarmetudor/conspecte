  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#909090"/></marker>
  </defs>
  <line x1="45" y1="240" x2="458" y2="240" stroke="#909090" stroke-width="1.1" marker-end="url(#ag)"/>
  <line x1="66.4" y1="262.4" x2="205.8" y2="32.8" stroke="#909090" stroke-width="1.1" marker-end="url(#ag)"/>
  <line x1="80" y1="240" x2="150" y2="240" stroke="#4C86D6" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="80" y1="240" x2="114" y2="184" stroke="#4C86D6" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="137.5" y1="30" x2="404.5" y2="282" stroke="#8B7BD8" stroke-width="2.2"/>
  <line x1="80" y1="240" x2="360" y2="240" stroke="#E08A3C" stroke-width="4" opacity="0.45"/>
  <line x1="80" y1="240" x2="182" y2="72" stroke="#4CA88A" stroke-width="4" opacity="0.45"/>
  <circle cx="360" cy="240" r="5" fill="#8B7BD8"/>
  <circle cx="182" cy="72" r="5" fill="#8B7BD8"/>
  <circle cx="80" cy="240" r="4" fill="#909090"/>
  <text x="70" y="256" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">O</text>
  <text x="302" y="262" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">A(a; 0)</text>
  <text x="192" y="66" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">B(0; b)</text>
  <text x="190" y="262" font-size="16" fill="#E08A3C" text-anchor="start" font-weight="normal" font-style="italic">a</text>
  <text x="111" y="156" font-size="16" fill="#4CA88A" text-anchor="start" font-weight="normal" font-style="italic">b</text>
  <text x="118.5" y="230" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">e₁</text>
  <line x1="110.5" y1="211" x2="126.5" y2="211" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="76.4" y="206.4" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">e₂</text>
  <line x1="68.4" y1="187.4" x2="84.4" y2="187.4" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="300" y="50" font-size="16" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">x/a + y/b = 1</text>
  <text x="300" y="76" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a, b = „segmentele” tăiate</text>
  <text x="300" y="94" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">pe axe (cu semn, în unități</text>
  <text x="300" y="112" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">e₁, respectiv e₂)</text>
  <text x="20" y="280" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">cere a ≠ 0, b ≠ 0: d nu trece prin O și nu e paralelă cu axele</text>
