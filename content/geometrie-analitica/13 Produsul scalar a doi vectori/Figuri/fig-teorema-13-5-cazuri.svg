<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 290" width="556" height="290" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C86D6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E08A3C"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B7BD8"/></marker>
  </defs>
  <line x1="350" y1="20" x2="350" y2="270" stroke="#909090" stroke-width="0.8"/>
  <text x="25" y="30" font-size="14" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">cazul 1: a și b necoliniari</text>
  <line x1="70" y1="200" x2="185" y2="60" stroke="#4C86D6" stroke-width="2.8" marker-end="url(#ab)"/>
  <line x1="70" y1="200" x2="310" y2="175" stroke="#E08A3C" stroke-width="2.8" marker-end="url(#ao)"/>
  <line x1="185" y1="60" x2="310" y2="175" stroke="#8B7BD8" stroke-width="2.8" marker-end="url(#av)"/>
  <path d="M 123.5 192.5 A 54 54 0 0 0 104.7 158.6" fill="none" stroke="#8B7BD8" stroke-width="1.6"/>
  <text x="126" y="158" font-size="15" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-style="italic">α</text>
  <circle cx="70" cy="200" r="4.5" fill="#909090"/>
  <text x="56" y="208" font-size="16" fill="#909090" text-anchor="middle" font-weight="normal" font-style="italic">O</text>
  <text x="185" y="50" font-size="16" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">A</text>
  <text x="324" y="181" font-size="16" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">B</text>
  <text x="111.5" y="126" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <line x1="107" y1="107" x2="116" y2="107" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="196" y="213.5" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">b</text>
  <line x1="191.5" y1="194.5" x2="200.5" y2="194.5" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="269.5" y="111.5" font-size="17" fill="#8B7BD8" text-anchor="middle" font-weight="normal" font-style="italic">b−a</text>
  <line x1="258" y1="92.5" x2="281" y2="92.5" stroke="#8B7BD8" stroke-width="1.3" marker-end="url(#av)"/>
  <text x="25" y="236" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">teorema cosinusului în OAB:</text>
  <text x="25" y="256" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">|b − a|² = |a|² + |b|² − 2(a, b)</text>
  <text x="25" y="276" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ (a, b) = a₁b₁ + a₂b₂</text>
  <text x="362" y="30" font-size="14" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">cazul 2: a și b coliniari</text>
  <line x1="360" y1="120" x2="490" y2="120" stroke="#909090" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="370" y1="120" x2="430" y2="120" stroke="#E08A3C" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="370" y1="150" x2="460" y2="150" stroke="#4C86D6" stroke-width="3" marker-end="url(#ab)"/>
  <text x="400" y="112" font-size="17" fill="#E08A3C" text-anchor="middle" font-weight="normal" font-style="italic">b</text>
  <line x1="395.5" y1="93" x2="404.5" y2="93" stroke="#E08A3C" stroke-width="1.3" marker-end="url(#ao)"/>
  <text x="415" y="142" font-size="17" fill="#4C86D6" text-anchor="middle" font-weight="normal" font-style="italic">a</text>
  <line x1="410.5" y1="123" x2="419.5" y2="123" stroke="#4C86D6" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="366" y="196" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a = λb ⇒</text>
  <text x="366" y="216" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">(a, b) = λ|b|² =</text>
  <text x="366" y="236" font-size="13" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">= λb₁·b₁ + λb₂·b₂ =</text>
  <text x="366" y="256" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">= a₁b₁ + a₂b₂</text>
</svg>
