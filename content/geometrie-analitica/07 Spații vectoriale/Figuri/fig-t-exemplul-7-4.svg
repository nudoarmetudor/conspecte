  <text x="15" y="256" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">T. 6.11: a, b, p dependenți ⇒ p ∥ π</text>
  <text x="15" y="274" font-size="12" fill="#D4696A" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">q nu e combinație a lui a, b</text>
  <line x1="250" y1="15" x2="250" y2="285" stroke="#909090" stroke-width="0.8"/>
  <text x="262" y="22" font-size="13" fill="#909090" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">(⊇) orice p ∥ π se descompune</text>
  <polygon points="265,230 320,115 490,115 435,230" fill="#909090" fill-opacity="0.09" stroke="#909090" stroke-width="1.2" stroke-opacity="0.7"/>
