  <text x="262" y="256" font-size="12" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">T. 6.9: p = αa + βb</text>
  <text x="262" y="274" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">⇒ p ∈ L(a, b)</text>
  <text x="15" y="294" font-size="13" fill="#8B7BD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, system-ui, Arial, sans-serif">împreună: L(a, b) = exact vectorii paraleli cu π</text>
</svg>
