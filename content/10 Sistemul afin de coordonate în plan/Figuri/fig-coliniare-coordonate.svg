  <text x="30" y="26" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">a = {2; 1},  b = {4; 2}:  2/4 = 1/2  ⇒  coordonate proporționale</text>
  <text x="30" y="46" font-size="14" fill="#909090" text-anchor="start" font-weight="normal" font-family="Segoe UI, system-ui, Arial, sans-serif">x₁y₂ − x₂y₁ = 2·2 − 4·1 = 0  ⇒  a ∥ b</text>
